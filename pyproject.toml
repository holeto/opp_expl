[project]
name = "opponent-exploitation"
version = "0.1.0"
description = "Opponent exploitation in imperfect-information games"
readme = "README.md"
authors = [
    { name = "holecto6", email = "tomas.holecek999@seznam.cz" }
]
requires-python = ">=3.12.1"
dependencies = [
    "flax>=0.12.10",
    "jax>=0.11.1",
    "numpy>=2.0",
    "optax>=0.2.8",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]>=0.11.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oppex"
