# Configuration of one experiment. command: the CLI call per seed ({seed} is the seed);
# resolved_args: every argument after argparse defaults, read off the current CLI.
# Raw data paths are relative to the project directory (local or on the cluster).
experiment: 2026-11-24_lbr_chumps_bb
question: Which raise distribution are the paper's raising chumps? Raises in whole big blinds instead of chips, and a chump uniform over every legal action (the authors' description of the random chump)
checkpoint: null
opponent: chumps (call_raise and random with raises in big blinds; uniform over every legal action, raises in chips and in big blinds)
reference: Lisý & Bowling 2017 (notes/Local_best_response.pdf), Table 2
agent:
  type: LBR on the real game
  settings:
    rule: RealLBR (slumbot/lbr.py) on the real game, 20 000-chip stacks, 50/100 blinds; the chump is an exact model (uniform range, the chump's own fold probability after our bet)
    chumps: 'ChumpOpponent. call_raise (0, .5, .5) and random (1/3 each): action type drawn first, renormalised over valid types, then a raise size uniform over raise_sizes. uniform: every legal action equally likely (fold when facing a bet, check/call, each raise size). raise_sizes: raise beyond the call = k steps of 1 chip (chip) or 100 chips (bb), from the legal minimum raise (floor min) to all-in, the last step clipped onto the all-in'
code:
  exact_commit: null
  after_commit: 01add65
  uncommitted: src/oppex/policy_gradient/slumbot/lbr.py (raise_sizes, raise_step, raise_floor, uniform chump) and scripts/policy_gradient/lbr_chumps.py (--raise-step, --raise-floor)
  how_known: the cluster's lbr.py and lbr_chumps.py had the same md5 as the local working tree at submission (262d15db…, 65103f96…); with the default flags the new code replays 200 hands of the earlier random fc 3-4 run (seed 11) exactly
